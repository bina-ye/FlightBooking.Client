<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlightBooking — הוספת טיסה</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
          <a href="index.html" class="logo">
    <img src="images/לוגו האתר.jpg" alt="FlightBooking" class="logo-img">
</a> 
            <nav class="nav">
                <a href="index.html">חיפוש טיסות</a>
                <a href="flights.html">כל הטיסות</a>
                <a href="my-bookings.html" id="navMyBookings" hidden>ההזמנות שלי</a>
                <a href="admin.html" id="navAdmin" hidden>הוספת טיסה</a>
                <a href="login.html" id="navLogin">התחברות</a>
                <a href="#" id="navLogout" hidden>התנתקות</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>הוספת טיסה חדשה</h1>

        <div id="adminNotice" class="message message-error" style="display:none">
            אין לך הרשאת מנהל. <a href="login.html">להתחברות</a>
        </div>

        <div id="adminMessage" class="message" style="display:none"></div>

        <form id="flightForm" class="search-form" hidden>
            <div class="form-row">
                <label>מספר טיסה
                    <input type="text" id="flightNumber" required placeholder="LY999">
                </label>
                <label>מוצא (קוד)
                    <input type="text" id="originCode" required maxlength="3" placeholder="TLV">
                </label>
                <label>יעד (קוד)
                    <input type="text" id="destinationCode" required maxlength="3" placeholder="JFK">
                </label>
            </div>

            <div class="form-row">
                <label>זמן המראה
                    <input type="datetime-local" id="departureTime" required>
                </label>
                <label>זמן נחיתה
                    <input type="datetime-local" id="arrivalTime" required>
                </label>
            </div>

            <div class="form-row">
                <label>מחיר (₪)
                    <input type="number" id="price" required min="1" step="1" placeholder="1500">
                </label>
                <label>שער
                    <input type="text" id="gate" required maxlength="10" placeholder="B7">
                </label>
                <label>סוג מטוס
                    <input type="text" id="aircraftType" required maxlength="50" placeholder="Boeing 787">
                </label>
            </div>

            <button type="submit" class="btn btn-primary">צור טיסה</button>
        </form>
    </main>

    <footer class="site-footer">
        <div class="container">FlightBooking &copy; 2026</div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
