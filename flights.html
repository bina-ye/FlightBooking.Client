<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>כל הטיסות | FLYBY</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/flights.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <img src="images/לוגו האתר.jpg" alt="FlightBooking" class="logo-img">
      </a>
      <nav class="main-nav nav">
        <a href="index.html">חיפוש טיסות</a>
        <a href="flights.html" class="active">כל הטיסות</a>
        <a href="my-bookings.html" id="navMyBookings" hidden>ההזמנות שלי</a>
        <a href="admin.html" id="navAdmin" hidden>הוספת טיסה</a>
        <a href="login.html" id="navLogin">התחברות</a>
        <a href="#" id="navLogout" hidden>התנתקות</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <section class="page-head">
      <span class="page-eyebrow">לוח טיסות</span>
      <h1>כל הטיסות</h1>
      <p class="subtitle" id="flightsMeta">טוען טיסות…</p>
    </section>

    <section class="filters" aria-label="סינון טיסות">
      <div class="filters-head">
        <span class="filters-title">
          <svg class="filters-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20l-3.6-3.6"></path>
          </svg>
          סינון תוצאות
        </span>
        <span class="filters-hint">אפשר לסנן לפי נמל, תאריך או שניהם</span>
      </div>

      <div class="filters-row">
        <input id="filterOrigin" type="text" maxlength="3" placeholder="מוצא" aria-label="קוד נמל מוצא">
        <input id="filterDestination" type="text" maxlength="3" placeholder="יעד" aria-label="קוד נמל יעד">
        <label class="filter-date">
          <span>מתאריך</span>
          <input id="filterFrom" type="date" aria-label="מתאריך יציאה">
        </label>
        <label class="filter-date">
          <span>עד תאריך</span>
          <input id="filterTo" type="date" aria-label="עד תאריך יציאה">
        </label>
        <div class="filters-actions">
          <button id="filterBtn" class="btn btn-primary" type="button">סנן</button>
          <button id="clearFilterBtn" class="btn btn-outline" type="button">נקה</button>
        </div>
      </div>
    </section>

    <div id="message" class="message hidden"></div>

    <div id="flightsList" class="flight-list"></div>

    <div id="pagination" class="pagination"></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-inner">
        <a href="index.html" class="footer-logo">
          <img src="images/לוגו האתר.jpg" alt="FlightBooking" class="footer-logo-img">
        </a>
        <nav class="footer-links">
          <a href="index.html">חיפוש טיסות</a>
          <a href="flights.html">כל הטיסות</a>
          <a href="my-bookings.html">ההזמנות שלי</a>
        </nav>
        <span class="footer-text">טיסות בקלות, מכל מקום</span>
      </div>
      <div class="footer-bottom">
        <span>FLYBY &copy; 2026</span>
        <span>כל הזכויות שמורות</span>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/all-flights.js"></script>
</body>
</html>
