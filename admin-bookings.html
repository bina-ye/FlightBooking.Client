<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLYBY — כל ההזמנות</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="logo" aria-label="FLYBY — טיסות בקלות">
                <span class="logo__mark" aria-hidden="true">
                    <svg viewBox="0 0 200 200" fill="currentColor">
                        <path d="M172 92a8 8 0 0 0-8-8h-40l-40-46h-14l20 46H52l-12-14H28l8 24-8 24h12l12-14h38l-20 46h14l40-46h40a8 8 0 0 0 8-8z"/>
                    </svg>
                </span>
                <span class="logo__word">FLYBY</span>
            </a>
            <nav class="nav">
                <a href="index.html">חיפוש טיסות</a>
                <a href="flights.html">כל הטיסות</a>
                <a href="my-bookings.html" id="navMyBookings" class="nav-cta" hidden>ההזמנות שלי</a>
                <a href="admin.html" id="navAdmin" hidden>הוספת טיסה</a>
                <a href="admin-bookings.html" id="navAdminBookings" class="is-current" hidden>כל ההזמנות</a>
                <a href="login.html" id="navLogin" class="nav-cta">התחברות</a>
                <a href="#" id="navLogout" hidden>התנתקות</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <section class="page-head">
                <span class="page-eyebrow">ניהול</span>
                <h1>כל ההזמנות</h1>
                <p class="subtitle" id="bookingsMeta">טוען הזמנות…</p>
            </section>

            <div id="adminNotice" class="message message-error" style="display:none">
                אין לך הרשאת מנהל. <a href="login.html">להתחברות</a>
            </div>

            <div id="bookingsMessage" class="message" style="display:none"></div>

            <div id="bookingsList" class="results-grid"></div>
            <div id="pagination" class="pagination"></div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-top">
                <div>
                    <div class="footer-brand">
                        <span class="logo__mark" aria-hidden="true">
                            <svg viewBox="0 0 200 200" fill="currentColor">
                                <path d="M172 92a8 8 0 0 0-8-8h-40l-40-46h-14l20 46H52l-12-14H28l8 24-8 24h12l12-14h38l-20 46h14l40-46h40a8 8 0 0 0 8-8z"/>
                            </svg>
                        </span>
                        <span class="logo__word">FLYBY</span>
                    </div>
                    <div class="footer-brand-rule"></div>
                    <p class="footer-about">טיסות בקלות, מכל מקום</p>
                </div>

                <div class="footer-col">
                    <h4>ניהול</h4>
                    <a href="admin.html">הוספת טיסה</a>
                    <a href="admin-bookings.html">כל ההזמנות</a>
                </div>

                <div class="footer-col">
                    <h4>ניווט</h4>
                    <a href="index.html">חיפוש טיסות</a>
                    <a href="flights.html">כל הטיסות</a>
                </div>
            </div>

            <div class="footer-bottom">
                <span>FLYBY &copy; 2026</span>
                <span>כל הזכויות שמורות</span>
            </div>
        </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin-bookings.js"></script>
