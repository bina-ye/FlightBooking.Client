<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLYBY — הרשמה</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
        <a href="index.html" class="logo">
    <img src="images/לוגו האתר.jpg" alt="FlightBooking" class="logo-img">
</a> 
            <nav class="nav">
                <a href="index.html">חיפוש טיסות</a>
                <a href="flights.html">כל הטיסות</a>
                <a href="my-bookings.html" id="navMyBookings" hidden>ההזמנות שלי</a>
                <a href="admin.html" id="navAdmin" hidden>הוספת טיסה</a>

                <a href="login.html" id="navLogin">התחברות</a>
                <a href="#" id="navLogout" hidden>התנתקות</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>הרשמה</h1>

        <div class="form-card">
            <form id="registerForm">
                <div class="form-row">
                    <label for="fullName">שם מלא</label>
                    <input type="text" id="fullName" maxlength="200" required autocomplete="name">
                </div>

                <div class="form-row">
                    <label for="email">אימייל</label>
                    <input type="email" id="email" maxlength="256" required autocomplete="email">
                </div>

                <div class="form-row">
                    <label for="password">סיסמה (לפחות 8 תווים)</label>
                    <input type="password" id="password" minlength="8" maxlength="100" required autocomplete="new-password">
                </div>

                <div id="registerMessage" class="message" style="display:none"></div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">הרשמה</button>
                </div>
            </form>

            <p style="margin-top:20px;font-size:.9rem;text-align:center">
                כבר יש לך חשבון? <a href="login.html">התחברות</a>
            </p>
        </div>
    </main>

  <footer class="site-footer">
  <div class="container">
    <div class="footer-inner">
      <a href="index.html" class="footer-logo">
        <img src="images/לוגו האתר.jpg" alt="FlightBooking" class="footer-logo-img">
      </a>
      <nav class="footer-links">
        <a href="index.html">חיפוש טיסות</a>
        <a href="flights.html">כל הטיסות</a>
        <a href="my-bookings.html">ההזמנות שלי</a>
      </nav>
      <span class="footer-text">טיסות בקלות, מכל מקום</span>
    </div>
    <div class="footer-bottom">
      <span>FLYBY &copy; 2026</span>
      <span>כל הזכויות שמורות</span>
    </div>
  </div>
</footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script> 
    <script src="js/register.js"></script>
</body>
</html>
