<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLYBY — בחירת מושב</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
           <a href="index.html" class="logo">
    <img src="images/לוגו האתר.jpg" alt="FlightBooking" class="logo-img">
</a> 
            <nav class="nav">
                <a href="index.html">חיפוש טיסות</a>
                <a href="flights.html">כל הטיסות</a>
                <a href="my-bookings.html" id="navMyBookings" hidden>ההזמנות שלי</a>
                <a href="admin.html" id="navAdmin" hidden>הוספת טיסה</a>
                <a href="login.html" id="navLogin">התחברות</a>
                <a href="#" id="navLogout" hidden>התנתקות</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>בחירת מושב</h1>

        <div id="flightSummary" class="summary-box">
            <div class="summary-row"><span class="label">טיסה</span><span id="flightNumber">—</span></div>
            <div class="summary-row"><span class="label">מסלול</span><span id="flightRoute">—</span></div>
            <div class="summary-row"><span class="label">יציאה</span><span id="flightDeparture">—</span></div>
            <div class="summary-row"><span class="label">מחיר למושב</span><span id="flightPrice">—</span></div>
        </div>

        <div id="seatsMessage" class="message" style="display:none"></div>

        <div class="legend">
            <span class="available">פנוי</span>
            <span class="booked">תפוס</span>
            <span class="selected">נבחר</span>
        </div>

        <div id="seatsGrid" class="seats-grid"></div>

        <div class="summary-box" style="margin-top:24px">
            <div class="summary-row">
                <span class="label">מושבים נבחרים</span>
                <span id="selectedSeats">לא נבחרו</span>
            </div>
            <div class="summary-row">
                <span class="label">סה"כ</span>
                <span id="totalPrice">0 ₪</span>
            </div>
        </div>

        <div class="form-actions">
            <a href="index.html" class="btn btn-secondary">חזרה לחיפוש</a>
            <button id="continueBtn" class="btn btn-primary" disabled>המשך להזמנה</button>
        </div>
    </main>

   <footer class="site-footer">
  <div class="container">
    <div class="footer-inner">
      <a href="index.html" class="footer-logo">
        <img src="images/לוגו האתר.jpg" alt="FlightBooking" class="footer-logo-img">
      </a>
      <nav class="footer-links">
        <a href="index.html">חיפוש טיסות</a>
        <a href="flights.html">כל הטיסות</a>
        <a href="my-bookings.html">ההזמנות שלי</a>
      </nav>
      <span class="footer-text">טיסות בקלות, מכל מקום</span>
    </div>
    <div class="footer-bottom">
      <span>FLYBY &copy; 2026</span>
      <span>כל הזכויות שמורות</span>
    </div>
  </div>
</footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script> 
    <script src="js/seats.js"></script>
</body>
</html>
